<!DOCTYPE html>
<html>

<meta charset="UTF-8">
<title>Mramor MNE</title>
<script>
  var chosen = document.cookie.match(/lang=([a-z]+)/);
  if (chosen) {
    location.replace('/' + chosen[1] + '/');
  } else {
    location.replace('/me/');
  }
</script>
<noscript>
  <meta http-equiv="refresh" content="0;url=/me/">
</noscript>
</head>
<body></body>
</html>
